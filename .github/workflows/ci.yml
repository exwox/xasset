name: quality
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_DB: xasset, POSTGRES_USER: xasset, POSTGRES_PASSWORD: test_password }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xasset -d xasset" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
    env:
      APP_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://xasset:test_password@127.0.0.1:5432/xasset
      INTEGRATION_DATABASE_URL: postgresql://xasset:test_password@127.0.0.1:5432/xasset
      REDIS_URL: redis://127.0.0.1:6379
      AUTH_SECRET: ci-secret-at-least-32-characters-long
      S3_ENDPOINT: http://127.0.0.1:9100
      S3_REGION: ap-southeast-1
      S3_BUCKET: xasset
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
